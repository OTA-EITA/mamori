version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Only propose versions that have been public for a week, so hijacked
    # releases are usually pulled before they reach this repository.
    cooldown:
      default-days: 7
    # Major versions are upgraded by hand after reading the release notes.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Stay on the Node.js LTS line; moving to the next LTS is done by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
