name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Config (without secrets), requests, or the apps involved.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mamori version or commit
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or audit events
      description: Remove passwords, tokens and personal data first.
